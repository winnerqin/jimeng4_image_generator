<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频任务状态</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .nav-bar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .nav-bar a {
            text-decoration: none;
            color: #333;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .nav-bar a:hover, .nav-bar a.active {
            background: #667eea;
            color: white;
        }
        
        .user-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logout-btn {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .search-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .search-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }
        
        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .task-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .task-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .task-id {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .status-queued, .status-running {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .status-succeeded, .status-completed {
            background: #e8f5e9;
            color: #388e3c;
        }
        
        .status-failed, .status-error {
            background: #ffebee;
            color: #d32f2f;
        }
        
        .task-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .info-label {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
        }
        
        .info-value {
            font-size: 1em;
            color: #333;
            word-break: break-all;
        }
        
        .info-value a {
            color: #667eea;
            text-decoration: none;
        }
        
        .info-value a:hover {
            text-decoration: underline;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        
        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="/">🎨 单图生成</a>
        <a href="/batch">📦 批量生成</a>
        <a href="/records">📊 生成记录</a>
        <a href="/video-generate">🎬 视频生成</a>
        <a href="/video-status" class="active">📹 视频任务状态</a>
        <a href="/script-analysis">🎬 剧本分析</a>
        <a href="/manage-samples">🖼️ 素材管理</a>
        {% if user.username == 'system_admin' %}
        <a href="/stats">📈 系统统计</a>
        {% endif %}
        <div class="user-info">
            <span>👤 <span class="username">{{ user.username }}</span></span>
            <a href="/logout" class="logout-btn">登出</a>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1>📹 视频任务状态查询</h1>
            <p>输入任务ID，查询视频生成任务的状态和结果</p>
        </div>
        
        <div class="content">
            <div class="search-section">
                <form class="search-form" id="searchForm">
                    <div class="form-group">
                        <label for="taskId">任务ID</label>
                        <input type="text" id="taskId" name="taskId" placeholder="请输入任务ID" required>
                    </div>
                    <button type="submit" class="btn btn-primary">🔍 查询</button>
                </form>
                <div class="auto-refresh">
                    <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                    <label for="autoRefresh">自动刷新（每10秒）</label>
                </div>
            </div>
            
            <div id="taskResult"></div>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        let currentTaskId = null;
        
        // 从URL参数获取任务ID
        const urlParams = new URLSearchParams(window.location.search);
        const taskIdFromUrl = urlParams.get('task_id');
        if (taskIdFromUrl) {
            document.getElementById('taskId').value = taskIdFromUrl;
            currentTaskId = taskIdFromUrl;
            queryTaskStatus(taskIdFromUrl);
        }
        
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const taskId = document.getElementById('taskId').value.trim();
            if (taskId) {
                currentTaskId = taskId;
                queryTaskStatus(taskId);
            }
        });
        
        function queryTaskStatus(taskId) {
            const taskResult = document.getElementById('taskResult');
            taskResult.innerHTML = '<div class="loading">查询中...</div>';
            
            fetch(`/api/video-task-status?task_id=${encodeURIComponent(taskId)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayTaskInfo(data);
                    } else {
                        taskResult.innerHTML = `<div class="empty-state">❌ 查询失败: ${data.error || '未知错误'}</div>`;
                    }
                })
                .catch(error => {
                    taskResult.innerHTML = `<div class="empty-state">❌ 查询失败: ${error.message}</div>`;
                });
        }
        
        function displayTaskInfo(data) {
            const taskResult = document.getElementById('taskResult');
            const status = data.status || 'unknown';
            const statusClass = `status-${status.toLowerCase()}`;
            
            let html = `
                <div class="task-card">
                    <div class="task-header">
                        <div class="task-id">任务ID: ${data.task_id}</div>
                        <div class="status-badge ${statusClass}">${status}</div>
                    </div>
                    <div class="task-info">
                        <div class="info-item">
                            <div class="info-label">状态</div>
                            <div class="info-value ${statusClass}">${status}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">下载链接</div>
                            <div class="info-value">
                                ${data.download_url ? `<a href="${data.download_url}" target="_blank">${data.download_url}</a>` : '-'}
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">尾帧图像</div>
                            <div class="info-value">
                                ${data.last_frame_image ? `<a href="${data.last_frame_image}" target="_blank">${data.last_frame_image}</a>` : '-'}
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">使用Token</div>
                            <div class="info-value">${data.tokens_used || '-'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">创建日期</div>
                            <div class="info-value">${data.created_at || '-'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">更新日期</div>
                            <div class="info-value">${data.updated_at || '-'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">时长</div>
                            <div class="info-value">${data.duration ? data.duration + ' 秒' : '-'}</div>
                        </div>
                    </div>
                </div>
            `;
            
            taskResult.innerHTML = html;
        }
        
        function toggleAutoRefresh() {
            const autoRefresh = document.getElementById('autoRefresh');
            
            if (autoRefresh.checked) {
                if (!currentTaskId) {
                    alert('请先输入任务ID并查询');
                    autoRefresh.checked = false;
                    return;
                }
                // 每10秒刷新一次
                autoRefreshInterval = setInterval(() => {
                    if (currentTaskId) {
                        queryTaskStatus(currentTaskId);
                    }
                }, 10000);
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }
        
        // 页面卸载时清除定时器
        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
